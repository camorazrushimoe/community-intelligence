[project]
name = "community-intelligence"
version = "0.1.0"
description = "Market intelligence for the video-game industry, built from player voice."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
